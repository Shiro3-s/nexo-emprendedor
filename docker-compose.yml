services:
  postgres:
    image: postgres:16-alpine
    container_name: nexo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexo_user
      POSTGRES_PASSWORD: nexo_pass
      POSTGRES_DB: nexo_emprendedor
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
